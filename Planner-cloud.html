<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Time Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍋</text></svg>">
<style>
:root{
  --h:56px; /* height of one hour; keep in sync with H in the script */
  --bg:#fffbea; --card:#fffef7; --ink:#3b3417; --muted:#8a7f55; --line:#f3e9b4;
  --yellow:#f9d423; --yellow-deep:#e8ac00; --plan-bg:#fff4bd; --plan-line:#e3c552;
  --rec-bg:#fbd52f; --live-bg:#f5b800; --block-ink:#3b3417; --now:#ef6c3a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1a10; --card:#26230f; --ink:#f6efc9; --muted:#b3a66a; --line:#37331a;
    --plan-bg:#3a3414; --plan-line:#8a7420; --rec-bg:#f4cd2a; --live-bg:#ffb800;
    --block-ink:#2a2408; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1a10; --card:#26230f; --ink:#f6efc9; --muted:#b3a66a; --line:#37331a;
  --plan-bg:#3a3414; --plan-line:#8a7420; --rec-bg:#f4cd2a; --live-bg:#ffb800;
  --block-ink:#2a2408; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 60px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:8px 14px}
button:focus-visible,input:focus-visible,textarea:focus-visible,.blk:focus-visible{outline:2px solid var(--yellow-deep);outline-offset:2px}
button.primary{background:var(--yellow);border-color:var(--yellow-deep);color:#3b3417;font-weight:700}
button.danger{color:#c2410c}
.running button.primary{background:var(--live-bg)}
input,textarea{background:var(--card);border:1px solid var(--plan-line);border-radius:10px;padding:9px 12px;min-width:0}
textarea{resize:none;width:100%}

/* sticky top */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:6px}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.nav h1{font-size:1.05rem;margin:0 auto 0 4px;font-weight:700}
.nav button{padding:5px 11px}
.stats{display:flex;gap:16px;color:var(--muted);font-size:.84rem;margin-bottom:10px;font-variant-numeric:tabular-nums}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.clock{font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.clock.sm{font-size:1.1rem}
.running .clock{color:var(--yellow-deep)}
.bar input{flex:1;min-width:130px}

/* Plan / Record headings */
.cols{display:grid;grid-template-columns:1fr 56px 1fr;margin-top:10px}
.tab{justify-self:center;display:inline-flex;align-items:center;gap:6px;border:none;background:transparent;font-weight:600;padding:5px 12px}
.tab.on{background:var(--yellow);color:#3b3417}
.tab.has::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--now)}
.sw{width:14px;height:10px;border-radius:3px;display:inline-block}
.sw.plan{background:var(--plan-bg);border:1.5px dashed var(--plan-line)}
.sw.rec{background:var(--rec-bg)}

/* panels that replace the date / stats / timer block */
.panel{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.ptitle{display:flex;align-items:center;gap:10px}
.ptitle b{margin-right:auto;font-size:.95rem}
.x{border:none;background:none;font-size:1.3rem;line-height:1;padding:0 6px;color:var(--muted)}
.panel textarea{flex:1;min-height:0;border:none;background:transparent;padding:2px 0}
.prow{display:flex;gap:8px}
.prow input{flex:1}

/* timeline */
.tl{position:relative;display:grid;grid-template-columns:1fr 56px 1fr;height:calc(24 * var(--h));margin-top:6px}
.col{position:relative;cursor:copy;
  background-image:linear-gradient(to bottom,transparent calc(var(--h) - 1px),var(--line) calc(var(--h) - 1px));
  background-size:100% var(--h)}
.axis{position:relative;color:var(--muted);font-size:.72rem;font-variant-numeric:tabular-nums;text-align:center}
.axis span{position:absolute;left:0;right:0;transform:translateY(-50%)}
.blk{position:absolute;border-radius:9px;padding:3px 7px;overflow:hidden;cursor:pointer;color:var(--block-ink)}
.blk b{display:block;font-weight:600;font-size:.82rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk small{display:block;font-size:.72rem;opacity:.75;font-variant-numeric:tabular-nums}
.blk .nt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;opacity:.85}
.blk.plan{background:var(--plan-bg);border:1.5px dashed var(--plan-line);color:var(--ink)}
.blk.rec{background:var(--rec-bg)}
.blk.live{background:var(--live-bg);box-shadow:0 0 0 2px var(--yellow-deep) inset}
.blk:hover{filter:brightness(.97)}
.now{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--now);z-index:3;pointer-events:none}
.now em{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);background:var(--now);color:#fff;
  font-style:normal;font-size:.7rem;padding:0 6px;border-radius:9px;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:.8rem;text-align:center;margin:14px 0 0}
.tools{display:flex;gap:6px;justify-content:center;margin-top:10px}
.tools button{border:none;background:none;color:var(--muted);font-size:.82rem}

/* dialog */
dialog{border:1px solid var(--plan-line);border-radius:18px;background:var(--card);color:var(--ink);padding:20px;width:min(340px,92vw)}
dialog::backdrop{background:rgba(59,52,23,.4)}
dialog h2{font-size:1rem;margin:0 0 14px}
dialog label{display:block;font-size:.84rem;color:var(--muted);margin-bottom:12px}
dialog label input,dialog label textarea{display:block;width:100%;margin-top:4px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:#c2410c;font-size:.82rem;min-height:1.2em;margin:0 0 8px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .sp{flex:1}

:root{--c0:#def4e0;--cd0:#6cc17c;--c1:#dcecfa;--cd1:#6aa8e0;--c2:#ffe4d4;--cd2:#f0a074;--c3:#e9e3fa;--cd3:#a592e6;--c4:#efebd9;--cd4:#b9b08a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c0:#25402b;--cd0:#5ea46c;--c1:#243a52;--cd1:#5b94cc;--c2:#4a3326;--cd2:#d98a5f;--c3:#38304f;--cd3:#8f7fd0;--c4:#3a3727;--cd4:#a89f6a}}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--plan-line);border-radius:10px;padding:9px 12px;min-width:0}
dialog select{display:block;width:100%;margin-top:4px}
.prow select{flex:1}
input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:var(--yellow-deep)}
.blk{z-index:1}
.band{position:absolute;left:0;right:0;pointer-events:none;border-radius:8px;overflow:hidden}
.bandlbl{pointer-events:auto;cursor:pointer;display:inline-block;max-width:100%;margin:3px 0 0 9px;font-size:.78rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.bandlbl small{font-weight:400;opacity:.7}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1}
.on{background:var(--yellow);border-color:var(--yellow-deep);color:#3b3417}
#dSw{display:flex;gap:8px;margin:2px 0 12px}
#dSw i{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent}
#dSw i.on{border-color:var(--ink)}
dialog.mgr{inset:0;margin:0;width:100%;max-width:none;height:100%;max-height:none;border:none;border-radius:0;padding:0;background:var(--bg)}
.mw{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 60px}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mh input{flex:1}
.mh h3,.mgr h3{margin:0;font-size:1rem}
.mtabs{display:flex;gap:6px;margin:0 auto}
.mtabs .on{font-weight:700}
.qa{display:flex;gap:8px;margin-bottom:12px}
.qa input{flex:1}
.mgr ul{list-style:none;margin:0;padding:0}
.mgr li{border-bottom:1px solid var(--line)}
.tr{display:flex;align-items:center;gap:10px;padding:10px 2px;width:100%;border:none;background:none;border-radius:0}
.tn{flex:1;min-width:0;text-align:left;border:none;background:none;padding:0;cursor:pointer}
.tn b{display:block;font-weight:600;overflow-wrap:anywhere}
.tn small,.tr>small{color:var(--muted)}
.dn .tn b{text-decoration:line-through;opacity:.5}
.mgr small.late{color:#c2410c}
.ed{padding:0 2px 14px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:3px 10px;font-size:.82rem}

input,textarea,select{font-size:16px}
#panelPlan{height:140px}
dialog#dlg{overflow:visible}
.date{border:none;background:none;font-weight:700;font-size:1.05rem;padding:5px 8px}
.dwrap{position:relative}
.menu{position:absolute;left:0;top:100%;z-index:10;min-width:150px;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 8px 24px rgba(59,52,23,.15)}
.menu button{border:none;background:none;text-align:left;padding:10px 12px}
.pill{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--live-bg);border-color:var(--yellow-deep);color:#3b3417;font-weight:700;font-variant-numeric:tabular-nums;border-radius:999px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--now)}
.tab small{color:var(--muted);font-weight:500;font-size:.72rem}
.tab.on small{color:#3b3417}
.dt{border:none;background:none;padding:0;margin-bottom:14px;font-size:1rem;font-weight:700;color:var(--ink)}
.dt:disabled{color:var(--ink);cursor:default}
.two{gap:12px}
.two label{min-width:0}
dialog input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;width:100%;height:44px;text-align:left}
.cb{position:relative;min-width:0}
.cb input{width:100%;padding-right:30px}
.cb::after{content:"";position:absolute;right:12px;top:50%;margin-top:-2px;border:5px solid transparent;border-top-color:var(--muted);pointer-events:none}
dialog .cb{margin-bottom:12px}
.prow .cb{flex:1}
.cbl{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;max-height:210px;overflow:auto;background:var(--card);border:1px solid var(--plan-line);border-radius:12px;box-shadow:0 8px 24px rgba(59,52,23,.18);padding:4px}
.cg{padding:6px 10px 2px;font-size:.74rem;color:var(--muted)}
.ci{display:block;width:100%;text-align:left;border:none;background:none;border-radius:8px;padding:9px 10px}
.ci:hover{background:var(--plan-bg)}
.ce{color:var(--muted);border-top:1px solid var(--line);border-radius:0;margin-top:4px}

body.lock{position:fixed;left:0;right:0;width:100%;overflow:hidden}
.menu{min-width:190px}
.msum{display:flex;flex-direction:column;gap:2px;margin-top:4px;padding:8px 12px 4px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
dialog#dlg{overflow:auto;overscroll-behavior:contain;width:min(380px,94vw);padding:16px;max-height:calc(var(--vvh,100dvh) - 16px)}
html.kb dialog#dlg{margin:0 auto;top:calc(var(--vvt,0px) + 8px);bottom:auto}
dialog.mgr{overscroll-behavior:contain}
#pk{width:min(340px,92vw);padding:16px}
#pk h3{margin:0 0 2px;font-size:1rem}
.pkm{color:var(--muted);font-size:.84rem;margin-bottom:10px;font-variant-numeric:tabular-nums}
.pkn{white-space:pre-wrap;overflow-wrap:anywhere;max-height:50vh;overflow:auto;margin-bottom:12px}
.tsum{display:inline-flex;margin:0 0 10px;padding:4px 12px;border-radius:999px;font-size:.85rem;background:var(--bg);color:var(--ink)}
.acts{position:sticky;bottom:-16px;margin-bottom:-16px;padding:8px 0 16px;background:var(--card)}
.acts button{padding:5px 11px;font-size:.85rem}
.acts .g{border:none;background:none;color:var(--muted);padding:5px 8px}
.acts .danger.g{color:#c2410c}
.tn small{display:block}
.nt2{white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box!important;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rep{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rep select{flex:1;min-width:150px}
.rep .chips{width:100%}
.rep input[type=number]{width:90px}
.clr{display:inline-flex;align-items:center}
.clr input{width:auto;height:40px}
.clr button{border:none;background:none;padding:4px 8px;color:var(--muted);font-size:1.1rem}

.rep{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rep select,.rep input{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;height:40px;margin:0;padding:0 10px;border-radius:10px;font-size:16px;flex:none}
.wk{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk button{height:36px;padding:0}
.clr{position:relative;display:block;min-width:0}
.clr::before{content:attr(data-ph);position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;display:none}
.clr.e::before{display:block}
.clr.e input{color:transparent}
.clr button{position:absolute;top:-8px;right:-6px;width:22px;height:22px;padding:0;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:.8rem;line-height:1}
.pr{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:0 2px 10px}
.nt3{flex:1;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font-size:.9rem}
.sm{padding:3px 12px;font-size:.82rem}

.rep{grid-template-columns:repeat(3,1fr);gap:6px}
.rep select,.rep input{height:34px;font-size:14px;padding:0 8px}
.wk button{height:30px;font-size:13px}
.clr::before{left:8px;font-size:14px}
.ed{gap:8px}
.ed input[type=text]{height:36px}
input,select{text-align:left;text-align-last:left}
input::-webkit-date-and-time-value{text-align:left}

.cols .tab{width:8rem;justify-content:center;border:1.5px solid transparent;border-radius:10px;padding:5px 0}
.cols .tab.on{background:transparent;border-color:var(--yellow-deep);color:var(--ink)}
.mtabs .on{font-weight:400;background:transparent;border-color:var(--yellow-deep)}
#pk .acts button{flex:1;font-weight:400}
#pk .sp{display:none}
.rep{grid-template-columns:repeat(4,1fr)}
.f{position:relative;display:block;height:34px;min-width:0;border:1px solid var(--plan-line);border-radius:10px;background:var(--card);overflow:hidden}
.f .v{position:absolute;left:0;right:0;top:0;padding:0 8px;line-height:32px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;text-align:left}
.f .v.ph{color:var(--muted)}
.f select,.f input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;font-size:16px;background:none}
.tn small{color:var(--ink);opacity:.65;font-size:.84rem}
.nt3{color:var(--ink);font-size:.95rem}
.sm{border:none;background:none;color:var(--muted);font-size:.78rem;padding:2px 6px}

*:focus,*:focus-visible{outline:none!important}
button{-webkit-tap-highlight-color:transparent}
.cols .tab{justify-content:center}
.tl.fp,.tl.fr{grid-template-columns:52px 1fr}
.tl.fp #recCol,.tl.fr #planCol{display:none}
.tl.fp #axis{order:-1}
.tl.full .now em{left:26px}
.tl.full .blk .nt{-webkit-line-clamp:5}
.tl:not(.full) .nt.s0{display:none}
.mtabs{margin:0 0 0 auto}
.mtabs button{padding:5px 12px;font-size:.85rem}
.qa input{height:34px;background:transparent;border:1px dashed var(--plan-line)}
.sws{display:flex;gap:8px;margin:0 0 14px}
.sws button{width:24px;height:24px;border-radius:50%;padding:0;border:2px solid transparent}
.sws button.on{border-color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.pie{display:block;width:210px;height:210px;margin:8px auto 14px;color:var(--ink)}
.rng{display:flex;gap:6px;margin-bottom:6px}
.rng button,.mo button{padding:4px 10px;font-size:.82rem}
.bd{display:flex;flex-direction:column}
.bd button{display:flex;align-items:center;gap:8px;width:100%;border:none;background:none;border-radius:0;text-align:left;padding:6px 2px}
.bd .bl{margin-top:12px;font-weight:600}
.bd .bt{padding-left:18px;font-size:.92rem}
.bd b,.bd .n{flex:1;min-width:0;font-weight:inherit}
.bd button>span:last-child{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.ttl{margin:0 auto 0 4px}
.mo{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px 0 10px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.heat i{aspect-ratio:1;border-radius:8px;font-style:normal;font-size:.72rem;display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--line)}
.heat i:empty{background:none}
.bars{display:block;width:100%;margin-bottom:10px;color:var(--ink)}

.ttl2{border:none;background:none;font-size:1rem;padding:4px 8px}
.tn .dot{margin-right:6px}
.pl{position:relative;display:inline-block;min-width:130px;text-align:center}
.pl input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
.rng{flex-wrap:wrap}
.mo{gap:6px;flex-wrap:wrap}
.lst{display:flex;flex-direction:column;max-height:260px;overflow:auto;overscroll-behavior:contain;margin-bottom:12px;border:1px solid var(--line);border-radius:12px;padding:4px}
.lst button{border:none;background:none;text-align:left;border-radius:8px;padding:8px 10px}
.lst .cur{background:var(--plan-bg)}
.ys{display:flex;align-items:center;justify-content:center;gap:14px;padding:4px 0}
.ys button{padding:2px 10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 2px 4px}
.cal i,.cal button{height:34px;padding:0;font-style:normal;font-size:.85rem;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.cal button{text-align:center;color:var(--ink)}

#panelPlan .ptitle{display:none}
#dayNote{font-size:.7rem;font-weight:400}
#panelRec{height:150px}
.sws{flex-wrap:wrap}
#mgr .mw{font-size:.84rem}
#mgr input,#mgr textarea{font-size:14px}
#mgr .tn small{font-size:.76rem}
.gh2{display:flex;align-items:center;gap:6px;width:100%;border:none;background:none;border-radius:0;padding:12px 2px 4px;color:var(--muted);font-size:.78rem;text-align:left}
.gh2 span{margin-left:auto}
#cald{width:min(340px,92vw);padding:16px}
.cal button{border:none;background:none;border-radius:8px}
.cal .cur{background:var(--plan-bg)}
.selw{position:relative}
.nowrow{margin:-4px 0 8px;text-align:center}
.nowrow button{border:none;background:none;color:var(--muted);font-size:.78rem}
.lst{position:absolute;left:0;right:0;top:calc(100% - 6px);z-index:6;background:var(--card);box-shadow:0 10px 28px rgba(0,0,0,.18);max-height:300px;margin:0}
.lst .now::after{content:"•";color:var(--yellow-deep);margin-left:6px}

.bd button{justify-content:flex-start}
.bd b,.bd .n{flex:0 1 auto}
.bd button>span:last-child{flex:none;margin-left:10px}
.tlw{margin:6px 0 12px}
.tlh{position:relative;height:14px;margin:0 8px 0 52px;font-size:.7rem;color:var(--muted)}
.tlh i{position:absolute;font-style:normal;transform:translateX(-50%)}
.srow{display:flex;align-items:center;gap:8px;margin:4px 0}
.srow>span{width:44px;font-size:.74rem;color:var(--muted)}
.strip{position:relative;flex:1;height:22px;background:var(--line);border-radius:6px;overflow:hidden}
.strip i{position:absolute;top:0;bottom:0}
.dual{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:10px}

  ob.addEventListener('click',function(e){

      else if(xa==='yr')sv.yr+=+xv;

    else if(a==='step'){pstep(+v);yM=null;ovScroll=true;}
    else if(a==='amode'){ovMode=ovMode==='task'?'event':'task';}
    else if(a==='add'){ovAdd(+v);return;}

    else if(a==='nt'){openNt(+v);return;}
    else if(a==='blk'){var ln=el.parentNode,rc=ln.getBoundingClientRect();openBand(+ln.dataset.v,Math.min(7,Math.max(0,Math.floor((e.clientY-rc.top)/rc.height*8))));return;}

    else if(a==='day'){viewDay=+v;ovd.close();render();setTimeout(goNow,60);return;}

    else if(a==='stats'){sv.sel=null;sv.open=null;xr();$('stx').showModal();return;}
    ovr();

  $('bak').addEventListener('close',function(){if(!document.querySelector('dialog[open]')){document.body.classList.remove('lock');document.body.style.top='';}});
  $('bak').addEventListener('click',function(e){var r=$('bak').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('bak').close();});
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  var cald=$('cald'),calM=0;

  function drawCal(){
    var c=new Date(calM),n=new Date(c.getFullYear(),c.getMonth()+1,0).getDate(),i,now=new Date(),h;
    h='<div class="ch"><span class="chl"><button data-d="m-1">‹</button><button class="cm" data-d="vm">'+fd(c,{month:'long'})+'</button><button class="cm" data-d="vy">'+c.getFullYear()+'</button><button data-d="m1">›</button></span><button class="tdot" data-d="today" aria-label="Today"></button></div>';
    if(calV==='m'){h+='<div class="lsc">';for(i=0;i<12;i++)h+='<button data-d="pm" data-v="'+i+'" class="'+(i===c.getMonth()?'cur ':'')+(now.getFullYear()===c.getFullYear()&&now.getMonth()===i?'now':'')+'">'+fd(new Date(2000,i,1),{month:'long'})+'</button>';h+='</div>';}
    else if(calV==='y'){h+='<div class="lsc">';for(i=c.getFullYear()-12;i<=c.getFullYear()+12;i++)h+='<button data-d="py" data-v="'+i+'" class="'+(i===c.getFullYear()?'cur ':'')+(i===now.getFullYear()?'now':'')+'">'+i+'</button>';h+='</div>';}
    else{
      h+='<div class="cal">'+'MTWTFSS'.split('').map(function(d){return '<i>'+d+'</i>';}).join('');

  cald.addEventListener('click',function(e){

  async function enterPlanner(user){
    currentUser=user;
    $('authGate').hidden=true;
    $('accountEmail').textContent=user.email||'';
    $('cloudState').textContent='Loading…';
    try{
      var result=await cloud.from('planner_data').select('data').eq('user_id',user.id).maybeSingle();
      if(result.error)throw result.error;
      if(result.data&&result.data.data){
        applyingRemote=true;
        state=result.data.data;
        if(!state.days)state.days={};
        ['labels','tasks','blocks','events'].forEach(function(k){if(!state[k])state[k]=[];});
        if(!state.pn)state.pn={};
        applyingRemote=false;
      }else{
        // First login: transfer this browser's existing planner data to the cloud.
        state=initialLocalState;
        var up=await cloud.from('planner_data').upsert({user_id:user.id,data:state,updated_at:new Date().toISOString()},{onConflict:'user_id'});
        if(up.error)throw up.error;
      }
      cloudReady=true;
      render();tick();goNow();
      $('cloudState').textContent='Synced';
      // Receive edits made on another signed-in device.
      cloud.channel('planner-sync-'+user.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'planner_data',filter:'user_id=eq.'+user.id},function(payload){
        if(!payload.new||!payload.new.data)return;
        if(saveTimer)clearTimeout(saveTimer);
        applyingRemote=true;state=payload.new.data;
        if(!state.days)state.days={};['labels','tasks','blocks','events'].forEach(function(k){if(!state[k])state[k]=[];});if(!state.pn)state.pn={};
        applyingRemote=false;render();tick();$('cloudState').textContent='Synced';
      }).subscribe();
    }catch(err){
      cloudReady=false;
      $('authGate').hidden=false;
      $('authStatus').textContent='Could not load cloud data: '+(err.message||String(err));
      $('cloudState').textContent='Not synced';
    }
  }
  async function authAction(kind){
    var email=$('authEmail').value.trim(),password=$('authPassword').value;
    if(!email||!password){$('authStatus').textContent='Enter your email and password first.';return;}
    $('authStatus').textContent=kind==='signup'?'Creating account…':'Signing in…';
    try{
      var r=kind==='signup'?await cloud.auth.signUp({email:email,password:password}):await cloud.auth.signInWithPassword({email:email,password:password});
      if(r.error)throw r.error;
      if(kind==='signup'&&!r.data.session){$('authStatus').textContent='Account created. Check your email to confirm it, then sign in.';return;}
      if(r.data.user)await enterPlanner(r.data.user);
    }catch(err){$('authStatus').textContent=err.message||String(err);}
  }
  $('authSignIn').addEventListener('click',function(){authAction('signin');});
  $('authSignUp').addEventListener('click',function(){authAction('signup');});
  $('authSignOut').addEventListener('click',async function(){cloudReady=false;currentUser=null;await cloud.auth.signOut();$('authGate').hidden=false;$('authStatus').textContent='Signed out. Sign in to continue.';});
  cloud.auth.getSession().then(function(r){if(r.data&&r.data.session)enterPlanner(r.data.session.user);else{$('authGate').hidden=false;$('accountBar').style.visibility='hidden';}});
  cloud.auth.onAuthStateChange(function(event,session){if(event==='SIGNED_IN'&&session&&!currentUser)enterPlanner(session.user);});
  render();tick();goNow();
  setInterval(tick,250);
  setInterval(render,15000);
})();
